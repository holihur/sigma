<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#161618" />
    <title>Sigma — Prototype design, together</title>
    <meta
      name="description"
      content="Sigma is a collaborative interface design tool. Build high-fidelity prototypes on an infinite canvas."
    />
  </head>
  <body>
    <style>
      #boot { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #161618; color: #a1a1aa; font: 13px/1.5 system-ui, -apple-system, sans-serif; }
      #boot .boot-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      #boot .boot-logo { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #38bdf8, #0284c7); color: #fff; box-shadow: 0 12px 30px -12px rgba(14, 165, 233, .8); animation: bootPulse 1.4s ease-in-out infinite; }
      #boot .boot-logo svg { width: 26px; height: 26px; }
      @keyframes bootPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.94); opacity: .72; } }
    </style>
    <div id="boot" aria-label="Loading Sigma">
      <div class="boot-inner">
        <div class="boot-logo"><svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M21.5 10.2c-1.3-.9-2.9-1.4-4.7-1.4-3 0-5 1.4-5 3.7 0 2 1.3 2.9 4.2 3.6 2.4.6 3.1 1 3.1 2 0 1-1 1.6-2.5 1.6-1.9 0-3.5-.7-4.8-1.8l-.9 2.2c1.5 1.3 3.5 2 5.7 2 3.4 0 5.4-1.5 5.4-4 0-2.2-1.4-3.2-4.4-3.9-2.3-.5-3-1-3-1.8 0-.9.9-1.4 2.3-1.4 1.6 0 3 .6 4.2 1.5l.4-2.3Z"/></svg></div>
        <span>Loading your workspace…</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
