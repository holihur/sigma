name: Release

# Releases are produced by GitHub CI (GoReleaser). Do not publish from a
# workstation; local runs are snapshots for validation only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.4.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: GoReleaser (GitHub CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build web bundle
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Embed web bundle
        run: |
          rm -rf backend/internal/static/dist
          mkdir -p backend/internal/static/dist
          cp -R frontend/dist/. backend/internal/static/dist/

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Publish release with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
