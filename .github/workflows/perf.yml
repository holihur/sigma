name: Performance smoke

on:
  workflow_dispatch:

jobs:
  page-load:
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: sigma_perf
      PORT: "9000"
      STATIC_DIR: ${{ github.workspace }}/frontend/dist
      UPLOAD_DIR: /tmp/sigma-perf-uploads
      SIGMA_SECRET: sigma-perf-secret
      BASE_URL: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: "12.15.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "26.12.1"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: go build -o ../sigma-server .
        working-directory: backend
      - name: Start Sigma
        run: |
          nohup ./sigma-server > /tmp/sigma-perf.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/api/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/sigma-perf.log
          exit 1
      - uses: grafana/setup-k6-action@v1
      - name: Run k6 page-load scenario
        run: k6 run --summary-export=perf/summary.json perf/k6-page-load.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-summary
          path: |
            perf/summary.json
            /tmp/sigma-perf.log
